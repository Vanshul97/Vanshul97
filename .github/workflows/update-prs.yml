name: Update Merged PRs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch merged PRs and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Emit table rows for one repo. Uses process substitution (no subshell)
          # so nothing is lost; jq builds each Markdown row directly.
          rows() {
            repo="$1"; label="$2"
            gh pr list --author Vanshul97 --repo "$repo" --state merged \
              --json number,title --limit 50 \
              | jq -r --arg repo "$repo" --arg label "$label" '
                  .[]
                  | (if (.title | test("^\\[(pdata|fix|feat|bug)"; "i")) then "🔧" else "📝" end) as $icon
                  | (.title | gsub("^\\[[^\\]]*\\] "; "")) as $t
                  | "| \($icon) | [\($t)](https://github.com/\($repo)/pull/\(.number)) | \($label) |"'
          }

          {
            echo "| | PR | Repository |"
            echo "|---|---|---|"
            rows open-telemetry/opentelemetry-collector-contrib collector-contrib
            rows open-telemetry/opentelemetry-collector          collector-core
            rows grafana/backstage-plugin-grafana-catalog        grafana-catalog
          } > /tmp/pr_table.md

          # Rewrite the block between the markers. Emits clean marker lines so a
          # previously glued END marker can't corrupt the output.
          awk '
            /<!-- START_MERGED_PRS -->/ {
              print "<!-- START_MERGED_PRS -->"
              while ((getline line < "/tmp/pr_table.md") > 0) print line
              skip = 1
              next
            }
            /<!-- END_MERGED_PRS -->/ { print "<!-- END_MERGED_PRS -->"; skip = 0; next }
            !skip { print }
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add README.md && git commit -m "chore: auto-update merged PRs" && git push)
