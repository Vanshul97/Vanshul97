name: Update Merged PRs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch merged PRs and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Curated influence order. One entry per line: "owner/repo#num|icon".
          # Position = rank (top line ranks highest). PRs not listed here are
          # appended after, newest-first, with an auto-detected icon.
          PRIORITY='open-telemetry/opentelemetry-collector#15138|🔧
          open-telemetry/opentelemetry-collector-contrib#48050|🔧
          grafana/backstage-plugin-grafana-catalog#160|🔧
          open-telemetry/opentelemetry-collector-contrib#48761|🔧
          open-telemetry/opentelemetry-collector-contrib#48764|🔧'
          # strip the YAML indentation from each PRIORITY line
          PRIORITY=$(printf '%s\n' "$PRIORITY" | sed 's/^ *//')

          # Emit "num<TAB>autoicon<TAB>cleantitle<TAB>repo<TAB>label" for a repo.
          fetch() {
            gh pr list --author Vanshul97 --repo "$1" --state merged \
              --json number,title --limit 50 \
              | jq -r --arg repo "$1" --arg label "$2" '
                  .[]
                  | (if (.title | test("^\\[(pdata|fix|feat|bug)"; "i")) then "🔧" else "📝" end) as $icon
                  | "\(.number)\t\($icon)\t\(.title | gsub("^\\[[^\\]]*\\] "; ""))\t\($repo)\t\($label)"'
          }

          # Prefix each row with a numeric rank from PRIORITY (override icon too).
          rank_rows() {
            while IFS=$'\t' read -r num icon title repo label; do
              hit=$(printf '%s\n' "$PRIORITY" | grep -n "^$repo#$num|" || true)
              if [ -n "$hit" ]; then
                r=$(printf '%s' "$hit" | head -1 | cut -d: -f1)
                icon=$(printf '%s' "$hit" | head -1 | cut -d'|' -f2)
              else
                r=$((100000 - num))   # unlisted: newer PRs (higher #) sort earlier
              fi
              printf '%06d\t| %s | [%s](https://github.com/%s/pull/%s) | %s |\n' \
                "$r" "$icon" "$title" "$repo" "$num" "$label"
            done
          }

          {
            echo "| | PR | Repository |"
            echo "|---|---|---|"
            {
              fetch open-telemetry/opentelemetry-collector-contrib collector-contrib
              fetch open-telemetry/opentelemetry-collector          collector-core
              fetch grafana/backstage-plugin-grafana-catalog        grafana-catalog
            } | rank_rows | sort -t"$(printf '\t')" -k1,1n | cut -f2-
          } > /tmp/pr_table.md

          # Rewrite the block between the markers. Emits clean marker lines so a
          # previously glued END marker can't corrupt the output.
          awk '
            /<!-- START_MERGED_PRS -->/ {
              print "<!-- START_MERGED_PRS -->"
              while ((getline line < "/tmp/pr_table.md") > 0) print line
              skip = 1
              next
            }
            /<!-- END_MERGED_PRS -->/ { print "<!-- END_MERGED_PRS -->"; skip = 0; next }
            !skip { print }
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add README.md && git commit -m "chore: auto-update merged PRs" && git push)
